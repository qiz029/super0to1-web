name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active deployment before starting the next one.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://super0to1.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test content and CMS behavior
        run: npm test

      - name: Build and prerender
        run: npm run build

      - name: Build CMS and private preview
        run: npm run cms:build

      - name: Record deployed commit
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { releaseId } = JSON.parse(readFileSync('content/published/site.json', 'utf8'));
          writeFileSync('dist/deploy-meta.json', JSON.stringify({ commit: process.env.GITHUB_SHA, releaseId }) + '\n');
          NODE

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
            exit 1
          fi
          npx --no-install wrangler d1 migrations apply super0to1-cms --config cms/wrangler.jsonc --remote
          npx --no-install wrangler deploy
          npx --no-install wrangler deploy --config cms/wrangler.jsonc

      - name: Verify production serves this commit
        run: |
          for attempt in {1..12}; do
            echo "Checking production deployment (attempt $attempt/12)"
            if curl --fail --silent --show-error --max-time 15 \
              "https://super0to1.com/deploy-meta.json?commit=$GITHUB_SHA" \
              | jq --exit-status --arg commit "$GITHUB_SHA" '.commit == $commit'; then
              curl --fail --silent --show-error --retry 3 --max-time 20 \
                https://super0to1.com/ | grep -F '<html lang="en">' > /dev/null
              curl --fail --silent --show-error --retry 3 --max-time 20 \
                https://super0to1.com/zh | grep -F '<html lang="zh-CN">' > /dev/null
              exit 0
            fi
            sleep 5
          done
          echo '::error::Production did not serve the expected commit within the verification window.'
          exit 1

      - name: Verify CMS requires authentication
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://cms.super0to1.com/api/state)
          if [[ "$status" != "302" && "$status" != "401" && "$status" != "403" ]]; then
            echo "::error::CMS returned unexpected unauthenticated status: $status"
            exit 1
          fi
